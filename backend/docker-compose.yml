name: file_deduplication

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: file_dedup_backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8002:8000"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - .:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: file_dedup_frontend

    restart: unless-stopped

    ports:
      - "5174:5173"

    depends_on:
      - backend

    volumes:
      - ../frontend:/app
      - /app/node_modules


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: file_dedup_celery

    restart: unless-stopped

    env_file:
      - .env

    command: celery -A app.celery_app.celery_app worker --loglevel=info

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - .:/app


  mysql:
    image: mysql:8.0

    container_name: file_dedup_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3309:3306"

    volumes:
      - file_dedup_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    container_name: file_dedup_redis

    restart: unless-stopped

    ports:
      - "6381:6379"

    volumes:
      - file_dedup_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


volumes:

  file_dedup_mysql_data:

  file_dedup_redis_data: